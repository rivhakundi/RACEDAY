name: RaceDay API CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "RaceDay_CI_P@ssw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P RaceDay_CI_P@ssw0rd -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Consumed by appsettings / DbContext in the API so CI never touches a real DB.
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=RaceDayDB_CI;User Id=sa;Password=RaceDay_CI_P@ssw0rd;TrustServerCertificate=True;"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Wait for SQL Server to be ready
        run: |
          for i in {1..10}; do
            if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "RaceDay_CI_P@ssw0rd" -C -Q "SELECT 1" &> /dev/null; then
              echo "SQL Server is ready"
              exit 0
            fi
            echo "Waiting for SQL Server... ($i/10)"
            sleep 5
          done
          echo "SQL Server did not become ready in time"
          exit 1

      - name: Apply EF Core migrations
        run: dotnet ef database update --project ./RaceDay.Api --startup-project ./RaceDay.Api
        continue-on-error: false

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/*.trx
