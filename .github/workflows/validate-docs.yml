name: RaceDay CI

on:
  push:
    branches:
      - master
      - main
      - develop

  pull_request:
    branches:
      - master
      - main
      - develop

  workflow_dispatch:

jobs:
  validate:
    name: Validate RaceDay Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README
        run: |
          test -f README.md
          echo "README.md found"

      - name: Check documentation
        run: |
          test -d docs
          echo "docs folder found"
          find docs -maxdepth 1 -type f -print

      - name: Check for .NET project
        id: dotnet
        shell: bash
        run: |
          PROJECT=$(find . \
            -type f \
            \( -name "*.sln" -o -name "*.csproj" \) \
            -not -path "./.git/*" \
            -print -quit)

          if [ -n "$PROJECT" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "Found .NET project: $PROJECT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .NET project found."
            echo "Skipping .NET build for now."
          fi

      - name: Setup .NET
        if: steps.dotnet.outputs.found == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        if: steps.dotnet.outputs.found == 'true'
        run: |
          dotnet restore "${{ steps.dotnet.outputs.project }}"

      - name: Build
        if: steps.dotnet.outputs.found == 'true'
        run: |
          dotnet build "${{ steps.dotnet.outputs.project }}" \
            --configuration Release \
            --no-restore

      - name: Test
        if: steps.dotnet.outputs.found == 'true'
        shell: bash
        run: |
          TEST_PROJECT=$(find . \
            -type f \
            -name "*Tests.csproj" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -n "$TEST_PROJECT" ]; then
            echo "Running tests: $TEST_PROJECT"
            dotnet test "$TEST_PROJECT" \
              --configuration Release \
              --no-build
          else
            echo "No test project found."
            echo "Skipping tests."
          fi